---
- name: Install FTS Desk Update silently with custom arguments
  hosts: active_host
  gather_facts: false
  tasks:
    - name: Install FTS Desk Update EXE
      ansible.windows.win_command: >
        "\\W-Server\Users\Administrator\EXE_Folder\FTS_DeskUpdateSetup_5020075_1304142"
        /SILENT
        /SUPPRESSMSGBOXES
        /LOG
        /NORESTART
        /NOCANCEL
        /DIR="C:\Program Files\FTS_DeskUpdate"
      args:
        creates: 'C:\Program Files\FTS_DeskUpdate'
